<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlvraMaps</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3D4CF5">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--g:rgba(255,255,255,.78);--tx:#15171c;--mut:#6b7080;--ln:rgba(0,0,0,.08);--f:rgba(120,125,140,.14);--b:#3D4CF5;color-scheme:light}
:root{--pb:rgba(244,245,250,.5);--blur:30px;--g1:rgba(255,255,255,.58);--g2:rgba(255,255,255,.16);--hi:rgba(255,255,255,.95);--lo:rgba(255,255,255,.35);--sh:rgba(30,40,90,.2);--sp:rgba(255,255,255,.55);--fl:#fff}
:root[data-theme=dark]{--g:rgba(22,23,29,.78);--tx:#f1f2f6;--mut:#9aa0b4;--ln:rgba(255,255,255,.1);--f:rgba(255,255,255,.1);--pb:rgba(8,9,14,.55);--g1:rgba(70,74,92,.5);--g2:rgba(18,20,30,.34);--hi:rgba(255,255,255,.3);--lo:rgba(255,255,255,.08);--sh:rgba(0,0,0,.5);--sp:rgba(255,255,255,.17);--fl:#16171d;color-scheme:dark}
.dk .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
#top input{width:auto;flex:1;min-width:0}
#menu{font-size:22px;padding:4px 8px}
#splash{position:fixed;inset:0;background:#3D4CF5;display:grid;place-items:center;z-index:100;transition:opacity .6s}
#splash img{width:min(72vw,360px);height:auto}
#lyr{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:4;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;padding:0}
.dk.sat .maplibregl-canvas{filter:none}
#rul{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:4;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;padding:0}
#mbar{display:none;position:absolute;left:70px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:7;align-items:center;gap:12px;padding:10px 14px}
#mbar b{flex:1}#mbar button{font-weight:700;color:var(--b)}
.chip{flex:none;padding:6px 12px;border-radius:16px;background:var(--f);font-size:13px;font-weight:600}
#panel{position:absolute;inset:0;z-index:20;background:var(--pb);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 40px;transform:translateX(-100%);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
#panel.show{transform:none}
#panel h2{margin:0}#panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:20px 0 6px}
.ph{display:flex;align-items:center;gap:8px}.ph button{font-size:28px;padding:4px 10px}
.pcard{background:var(--f);border-radius:20px;padding:4px 16px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}.pl:last-child{border:0}
.seg{display:flex;background:var(--f);border-radius:10px;padding:2px}.seg button{padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600}.seg button.on{background:var(--b);color:#fff}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--f);position:relative;flex:none;border:1px solid var(--ln)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--b)}.sw:checked::after{left:22px}
.pcard input[type=text],.pcard input[type=email]{width:100%;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--f);color:var(--tx);padding:0 12px;font:inherit;font-size:16px;margin-bottom:8px}
.pcard input[type=range]{width:100%;accent-color:var(--b)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.dot.on{border-color:var(--tx)}
.av{width:46px;height:46px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);overflow:hidden;overscroll-behavior:none}
#map{position:absolute;inset:0}
.glass{background:var(--g);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--ln);border-radius:22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 12px;z-index:5}
#top input{width:100%;height:40px;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--tx)}
#res{max-height:40vh;overflow:auto}
.r{padding:10px 2px;border-top:1px solid var(--ln);cursor:pointer}.r b{display:block;font-size:15px}.r small{color:var(--mut)}
#card{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:16px;z-index:5;display:none}
#card.show{display:block}
#card{max-height:62vh;overflow:auto}
.btn{background:var(--b);color:#fff;border-radius:14px;padding:13px;font-weight:700;font-size:16px;width:100%;margin-top:10px}
.btn.t{background:var(--f);color:var(--tx)}
.rc{display:flex;justify-content:space-between;padding:11px 14px;border-radius:14px;background:var(--f);margin-top:8px;border:2px solid transparent}.rc.on{border-color:var(--b)}
#nav{position:absolute;inset:0;pointer-events:none;display:none;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6}
#nav.show{display:flex}#nav>*{pointer-events:auto}
#ban{display:flex;gap:14px;align-items:center;padding:14px}
#mi{width:56px;height:56px;border-radius:16px;background:var(--b);display:grid;place-items:center;flex:none}
#lanes{align-self:flex-start;display:flex;padding:8px 10px}
.ln{width:36px;height:54px;border-radius:8px;border-left:1.5px dashed var(--ln)}.ln:first-child{border:0}.ln.v{background:var(--b)}
.ln path{stroke:var(--mut);opacity:.55}.ln.v path{stroke:#fff;opacity:1}
#spd{margin-top:auto;align-self:flex-start;display:flex;gap:12px;align-items:center;padding:8px 14px}
#lim{display:none;width:48px;height:48px;border-radius:50%;border:5px solid #E53935;background:#fff;color:#111;font-weight:800;font-size:18px;place-items:center}
#eta{margin-top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 18px}
.end{background:var(--f);color:#f0506e;border-radius:12px;padding:10px 18px;font-weight:700}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 16px;z-index:9;display:none}

/* ===== Liquid Glass ===== */
.glass,.pcard,.seg,.chip,.btn.t,.rc,.rl,.vcard,#vibeP{background:radial-gradient(130% 100% at 0% 0%,var(--sp),rgba(255,255,255,0) 46%),linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.05);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.05);box-shadow:inset 1.5px 1.5px 1px var(--hi),inset -1px -1px 1px var(--lo),inset 0 0 24px rgba(255,255,255,.07),0 10px 30px var(--sh);border:1px solid rgba(255,255,255,.26)}
.glass{border-radius:26px;position:relative}
.nog .glass,.nog .pcard,.nog .seg,.nog .chip,.nog .btn.t,.nog .rc,.nog .rl,.nog .vcard,.nog #vibeP{background:var(--fl)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:0 4px 14px var(--sh)}
#panel{backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(180%);-webkit-backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(180%)}
.nog #panel{background:var(--fl);backdrop-filter:none}
.btn:not(.t){background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),var(--b);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),inset 0 -1px 1px rgba(0,0,0,.15),0 8px 22px color-mix(in srgb,var(--b) 45%,transparent);border-radius:20px}
.btn,.chip,.seg button,#menu,#lyr,#rul,#dim,#vibe,.vcard,.rl{transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.btn:active,.chip:active,#lyr:active,#rul:active,#dim:active,#vibe:active,.vcard:active,.rl:active{transform:scale(.93)}
#top{border-radius:28px}
#top:focus-within{box-shadow:inset 1.5px 1.5px 1px var(--hi),0 0 0 3px color-mix(in srgb,var(--b) 40%,transparent),0 10px 30px var(--sh)}
.seg{border-radius:16px}.seg button{border-radius:13px}
.rc{border-radius:20px}
.rl{padding:6px 12px;border-radius:16px;font-weight:800;font-size:13px;color:var(--tx)}.rl.on{background:var(--b);color:#fff}
.tb{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(255,122,47,.2);color:#FF7A2F;font-weight:700}.tb.ok{background:rgba(20,200,180,.18);color:#14C8B4}
.vcard{padding:10px 4px;border-radius:20px;text-align:center}.vcard.on{outline:2.5px solid var(--b)}
#dim,#vibe{position:absolute;left:12px;z-index:4;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;padding:0}
#dim{bottom:calc(env(safe-area-inset-bottom,0px) + 146px)}#vibe{bottom:calc(env(safe-area-inset-bottom,0px) + 202px);font-size:20px}
#mini{position:absolute;left:66px;bottom:calc(env(safe-area-inset-bottom,0px) + 202px);z-index:4;display:none;align-items:center;gap:8px;padding:6px 10px 6px 6px;max-width:calc(100% - 140px)}
#mini.show{display:flex}#mini .t{min-width:0;flex:1}#mini .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini button{font-size:18px;padding:2px 4px}
#nav.show ~ #mini.show{left:auto;right:12px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:9}
#vibeP{position:absolute;left:0;right:0;bottom:0;height:80%;z-index:22;border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1);padding:12px 16px 24px;overflow:auto}
#vibeP.show{transform:none}
#vibeP .r{border-top:1px solid var(--ln)}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
/* ===== Big touch targets + dock ===== */
button{touch-action:manipulation}
#top{padding:8px 14px}
#top input{height:54px;font-size:17px}
#menu{width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;flex:none}
#wx{min-height:46px;padding:0 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;font-size:16px;font-weight:700}
span.chip{min-height:0;padding:5px 11px;font-size:12px}
.btn{min-height:58px;font-size:17px;border-radius:24px}
.seg button{min-height:48px;padding:0 16px}
.r{padding:15px 6px;min-height:60px}
.rc{padding:14px 16px;min-height:78px}
.pl{min-height:64px}
.sw{width:60px;height:36px;border-radius:18px}.sw::after{top:3px;left:3px;width:30px;height:30px}.sw:checked::after{left:27px}
input[type=range]{height:46px}
.pcard input[type=text],.pcard input[type=email]{height:54px;border-radius:18px;font-size:16px}
.ph button{width:54px;height:54px;font-size:32px}
.end{padding:16px 28px;font-size:17px;border-radius:22px}
.xb{width:48px;height:48px;border-radius:50%;font-size:20px;flex:none}
.vcard{min-height:92px}
#card{max-height:64vh;overflow:auto;padding:18px;border-radius:32px}
#dock{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--ch,0px) + 40px);z-index:4;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - var(--ch,0px) - 230px);overflow-y:auto;scrollbar-width:none;padding:2px;transition:bottom .3s}
#dock::-webkit-scrollbar{display:none}
#dock.tall{display:none}
#dock{padding:4px 8px 12px}
#dock .fb{box-shadow:inset 0 1.5px 1px var(--hi),0 4px 10px var(--sh)!important}
#dock .fb{position:static!important;left:auto!important;bottom:auto!important;width:58px!important;height:58px!important;border-radius:50%!important;font-size:24px!important;font-weight:800;display:grid;place-items:center;padding:0;flex:none}
#dock .fb.on{background:var(--b)!important;color:#fff}
#mini{left:14px;right:96px;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + var(--ch,0px) + 40px)}
#mbar{left:14px;right:96px}
#ob{display:none;position:absolute;inset:0;z-index:90;flex-direction:column;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 28px) 26px calc(env(safe-area-inset-bottom,0px) + 28px);background:rgba(240,242,250,.5);-webkit-backdrop-filter:blur(50px) saturate(1.8);backdrop-filter:blur(50px) saturate(1.8);transition:opacity .4s}
:root[data-theme=dark] #ob{background:rgba(8,9,14,.55)}
.ob-i{display:flex;align-items:center;gap:18px}
.ob-r{width:74px;height:74px;border-radius:50%;border:3.5px solid var(--b);display:grid;place-items:center;font-size:32px;flex:none;box-shadow:inset 0 0 22px color-mix(in srgb,var(--b) 28%,transparent),0 6px 20px color-mix(in srgb,var(--b) 22%,transparent)}
.ob-t b{display:block;font-size:24px;line-height:1.12}.ob-t small{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="splash"><img src="logo.png" alt="alvraMaps"></div>
<div id="top" class="glass"><div style="display:flex;align-items:center;gap:6px"><button id="menu" aria-label="Menu">☰</button><input id="q" placeholder="Where to?" autocomplete="off"><button id="wx" class="chip" style="display:none;flex:none"></button></div><div id="cats" style="display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none"></div><div id="chips" style="display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none"></div><div id="res"></div></div>
<div id="panel"></div>
<div id="card" class="glass"></div>
<div id="dock">
<button id="loc" class="glass fb" aria-label="My location">📍</button>
<button id="dim" class="glass fb" aria-label="2D or 3D">3D</button>
<button id="lyr" class="glass fb" aria-label="Satellite">🛰</button>
<button id="trf" class="glass fb" aria-label="Traffic">🚦</button>
<button id="orb" class="glass fb" aria-label="Flyover">🌐</button>
<button id="rul" class="glass fb" aria-label="Measure distance">📏</button>
<button id="vibe" class="glass fb" aria-label="Music">🎵</button>
</div>
<div id="ob"><div style="background:#3D4CF5;border-radius:24px;padding:14px 20px;align-self:flex-start"><img src="logo.png" alt="alvraMaps" style="height:26px;display:block"></div>
<div class="ob-i"><div class="ob-r">🗺</div><div class="ob-t"><b>Peta 2D &amp; 3D</b><small>2D &amp; 3D map</small></div></div>
<div class="ob-i"><div class="ob-r">🛣</div><div class="ob-t"><b>Pilihan laluan alternatif</b><small>Alternative routes</small></div></div>
<div class="ob-i"><div class="ob-r">🚦</div><div class="ob-t"><b>Info trafik &amp; anggaran ketibaan</b><small>Traffic info &amp; ETA</small></div></div>
<div class="ob-i"><div class="ob-r">🎙</div><div class="ob-t"><b>Panduan suara &amp; semakan tol terpilih</b><small>Voice guidance &amp; toll check</small></div></div>
<button class="btn" id="obgo">Mula · Get started</button></div><div id="mbar" class="glass"></div>
<div id="nav">
  <div id="ban" class="glass"><div id="mi"></div><div><div id="bd" style="font-size:28px;font-weight:800"></div><div id="bt"></div></div></div>
  <div id="lanes" class="glass"></div>
  <div id="spd" class="glass"><div><b id="spv" style="font-size:28px;line-height:1">0</b><div id="spu" style="font-size:11px;color:var(--mut)">km/h</div></div><div id="lim"></div></div>
  <div id="eta" class="glass"><div><div id="ea" style="font-size:24px;font-weight:800"></div><div id="eb" style="color:var(--mut)"></div></div><button class="end" id="end">End</button></div>
</div>
<div id="mini" class="glass"></div><div id="vibeP"></div><input type="file" id="vfile" accept="audio/*" multiple hidden>
<div id="msg" class="glass"></div>

<script>
const $=s=>document.querySelector(s);
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[101.687,3.139],zoom:11,attributionControl:{compact:true}});
const geo=new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true,showUserLocation:false});
map.addControl(geo,"bottom-right");
map.addControl(new maplibregl.NavigationControl({showZoom:false,visualizePitch:true}),"bottom-right");
let me=null,dest=null,destName="",routes=[],ri=0,marker=null,nav=null,muted=false;
const EMPTY={type:"FeatureCollection",features:[]};
const line=c=>({type:"Feature",geometry:{type:"LineString",coordinates:c}});
function msg(t){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display="none",2400)}

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({car:"arrow",look:"alvra",lang:"en",theme:"auto",accent:"#3D4CF5",units:"km",voice:true,volume:80,tilt:true,tolls:false,hwy:false},store.get("alvra_cfg",{}));
let acct=store.get("alvra_acct",null);
let parked=store.get("alvra_park",null);
const THEMES={alvra:{n:"Alvra",a:"#3D4CF5",b:"#FF5C9D"},ember:{n:"Ember",a:"#FF7A2F",b:"#FF5C9D"},lagoon:{n:"Lagoon",a:"#14C8B4",b:"#3D4CF5"},dusk:{n:"Dusk",a:"#7A3DF5",b:"#FF5C9D"}};
const routeGrad=()=>{const t=THEMES[cfg.look]||THEMES.alvra;return["interpolate",["linear"],["line-progress"],0,t.a,1,t.b]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VEH={
 arrow:{n:"Arrow",svg:a=>`<path d="M32 5 L53 57 L32 46 L11 57 Z" fill="${a}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>`},

function askLoc(){
  if(!navigator.geolocation){locCard("This browser does not support location.");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    me=[pos.coords.longitude,pos.coords.latitude];ensureMe(me,pos.coords.heading);wx(me[1],me[0]);
    if($("#card").classList.contains("loc"))$("#card").classList.remove("show","loc");
    if(!dest&&!nav)map.flyTo({center:me,zoom:15,duration:1200});
    try{geo.trigger()}catch(e){}
  },err=>locCard(err.code===1?"Location is blocked. Tap the lock icon in your browser address bar, open Permissions, allow Location, then tap the button below.":"Could not get your location. Make sure GPS is on."),
  {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

  L("alt","alt","#9AA0B4",6);map.addLayer({id:"alt-hit",type:"line",source:"alt",paint:{"line-color":"#000","line-width":30,"line-opacity":0.01}});L("casing","casing","#ffffff",11);map.addLayer({id:"route",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-gradient":routeGrad(),"line-width":7}});
  map.addSource("sat",{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19,attribution:"Imagery © Esri"});
  map.addLayer({id:"sat",type:"raster",source:"sat",layout:{visibility:"none"}},"alt");
  map.addSource("poi",{type:"geojson",data:EMPTY});
  map.addLayer({id:"poi",type:"circle",source:"poi",paint:{"circle-radius":8,"circle-color":"#FF5C9D","circle-stroke-color":"#ffffff","circle-stroke-width":2.5}},"alt");
  map.getStyle().layers.filter(l=>l.type==="symbol").forEach(l=>map.moveLayer(l.id,"poi"));
  map.addSource("meas",{type:"geojson",data:EMPTY});
  map.addLayer({id:"meas-l",type:"line",source:"meas",filter:["==","$type","LineString"],paint:{"line-color":"#FF7A2F","line-width":4}});

  for(let i=0;i<5;i++){d.unshift(A[ln%20]);d.unshift(A[la%20]);la=Math.floor(la/20);ln=Math.floor(ln/20)}

function parseMs(v){if(!v)return null;if(/mph/i.test(v))return Math.round(parseFloat(v)*1.609);const n=parseInt(v,10);return n>0&&n<=140?n:null}
function segD(p,a,b){const k=Math.cos(p[1]*Math.PI/180)*111320,ax=(a[0]-p[0])*k,ay=(a[1]-p[1])*110540,bx=(b[0]-p[0])*k,by=(b[1]-p[1])*110540,dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?-(ax*dx+ay*dy)/l:0;t=Math.max(0,Math.min(1,t));const x=ax+t*dx,y=ay+t*dy;return x*x+y*y}
function limitAt(n,p){if(!n.lim)return null;let best=900,v=null;for(const w of n.lim)for(let k=1;k<w.g.length;k++){const d=segD(p,w.g[k-1],w.g[k]);if(d<best){best=d;v=w.v}}return v}
async function loadLimits(n,from){
  if(n.limBusy)return;n.limBusy=true;
  try{
    const pts=[];let last=from;
    for(let i=from;i<n.g.length&&n.cum[i]-n.cum[from]<20000;i++){if(i===from||n.cum[i]-n.cum[last]>250){pts.push(n.g[i][1].toFixed(5),n.g[i][0].toFixed(5));last=i}}
    n.limCum=Math.min(n.total,n.cum[from]+20000);
    const q=`[out:json][timeout:25];way["highway"]["maxspeed"](around:25,${pts.join(",")});out tags geom;`;
    const r=await (await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)})).json();
    n.lim=(n.lim||[]).concat(r.elements.map(e=>({v:parseMs(e.tags&&e.tags.maxspeed),g:(e.geometry||[]).map(g=>[g.lon,g.lat])})).filter(w=>w.v&&w.g.length>1));
  }catch(e){}

}
async function saveOffline(){
  if(!(navigator.serviceWorker&&navigator.serviceWorker.controller)){msg("Close and reopen the app once, then try again");return}
  const id=Object.keys(map.getStyle().sources).find(k=>{const s=map.getSource(k);return s&&s.type==="vector"});
  const src=id&&map.getSource(id);
  if(!src||!src.tiles||!src.tiles[0]){msg("Map not ready. Try again in a moment.");return}
  const tpl=src.tiles[0],maxz=Math.min(src.maxzoom||14,14);
  const b=map.getBounds(),dw=(b.getEast()-b.getWest())/2,dh=(b.getNorth()-b.getSouth())/2;
  const W=b.getWest()-dw/2,E=b.getEast()+dw/2,S=Math.max(-85,b.getSouth()-dh/2),N=Math.min(85,b.getNorth()+dh/2),tl=[];
  for(let z=Math.max(6,Math.floor(map.getZoom())-4);z<=maxz;z++){
    const n=2**z,x0=Math.floor((W+180)/360*n),x1=Math.floor((E+180)/360*n);
    const ty=la=>Math.floor((1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n);
    const y0=ty(N),y1=ty(S);
    if(tl.length+(x1-x0+1)*(y1-y0+1)>1200)break;
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)tl.push(tpl.replace("{z}",z).replace("{x}",x).replace("{y}",y));
  }
  const bar=$("#mbar");bar.style.display="flex";let done=0,i=0;
  const upd=()=>{bar.innerHTML=`<b>⬇ Saving map… ${Math.round(done/tl.length*100)}%</b>`};upd();
  const worker=async()=>{while(i<tl.length){const u=tl[i++];try{await fetch(u)}catch(e){}done++;if(done%10===0)upd()}};
  await Promise.all(Array.from({length:6},worker));
  bar.style.display="none";msg("Saved "+tl.length+" map tiles for offline");
}

function dec(s){let i=0,la=0,lo=0,o=[];while(i<s.length){for(const isLat of [1,0]){let sh=0,r=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=r&1?~(r>>1):r>>1;isLat?la+=d:lo+=d}o.push([lo/1e6,la/1e6])}return o}
async function getRoutes(from,to,sl){
  const via=(sl||stops).map(s=>[s.lng,s.lat]);
  const host=travel==="foot"?"https://routing.openstreetmap.de/routed-foot/route/v1/foot/":travel==="bike"?"https://routing.openstreetmap.de/routed-bike/route/v1/bike/":"https://router.project-osrm.org/route/v1/driving/";
  const base=host+[from].concat(via,[to]).map(c=>c[0]+","+c[1]).join(";")+"?overview=full&geometries=polyline6&steps=true"+(via.length?"":"&alternatives=true");
  const ex=travel==="driving"?[cfg.tolls&&"toll",cfg.hwy&&"motorway"].filter(Boolean).join(","):"";
  let r=null;
  if(ex){try{r=await (await fetch(base+"&exclude="+ex)).json()}catch(e){}}
  if(!r||r.code!=="Ok")r=await (await fetch(base)).json();
  if(r.code!=="Ok")throw 0;
  return r.routes.map(x=>({g:dec(x.geometry),dist:x.distance,dur:x.duration,steps:x.legs.flatMap((l,li)=>l.steps.map(st=>Object.assign({},st,{_last:li===x.legs.length-1})))}));
}

function tollOf(r){return r.steps.some(st=>(st.intersections||[]).some(x=>(x.classes||[]).includes("toll")))}

  $("#eb").textContent=mins+" min · "+fmt(rem)+" · "+spd(kmh);
  const lim=limitAt(n,p),LE=$("#lim"),over=lim&&kmh>lim+5,mi=cfg.units==="mi";
  $("#spv").textContent=Math.round(mi?kmh*.621:kmh);$("#spu").textContent=mi?"mph":"km/h";$("#spv").style.color=over?"#FF7A2F":"";
  if(lim){LE.style.display="grid";LE.textContent=mi?Math.round(lim*.621):lim}else LE.style.display="none";
  const rest=n.g.slice(bi);map.getSource("route").setData(line(rest));map.getSource("casing").setData(line(rest));
  map.easeTo({center:p,bearing:hd==null||isNaN(hd)?map.getBearing():hd,pitch:cfg.tilt?60:0,zoom:17,duration:900,easing:x=>x});
  ensureMe(p,hd);
  if(rem<25){speak(cfg.lang==="ms"?"Anda telah tiba.":"You have arrived.");const tm=Math.max(1,Math.round((Date.now()-n.start)/60000)),tl=fmt(n.total);endNav();msg((cfg.lang==="ms"?"Tiba · ":"Arrived · ")+tl+" · "+tm+" min")}
}
function endNav(keepUI){
  if(!nav)return;try{nav.wl&&nav.wl.release()}catch(e){}clearInterval(nav.timer);if(nav.watch!=null)navigator.geolocation.clearWatch(nav.watch);if(nav.mk)nav.mk.remove();
  try{speechSynthesis.cancel()}catch(e){}nav=null;
  if(keepUI)return;
  $("#nav").classList.remove("show");$("#top").style.display="";$("#dock").style.display="";clearRoutes();map.easeTo({pitch:0,bearing:0,zoom:15,duration:800});$("#card").classList.remove("show");
}
$("#end").onclick=()=>endNav();
setTimeout(()=>{const sp=$("#splash");sp.style.opacity=0;setTimeout(()=>sp.remove(),650)},1300);
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
if("serviceWorker" in navigator&&!NATIVE)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
